# 自动发布 npm 包到 GitLab Package Registry。
#
# 触发方式：推送语义化版本 tag（如 v0.1.0）即自动构建并发布。
#   git tag v0.1.0 && git push origin v0.1.0
#
# 为什么用 CI 而不是本地 npm publish：
#   本机/agent 沙箱出口走代理，到内网 GitLab(10.8.0.102) 的 TLS 隧道被拦（502），
#   本地发不出去。GitLab CI runner 在 GitLab 内网内，能直连 registry。
#
# 鉴权：用内置 CI_JOB_TOKEN。GitLab 默认授予它对「本项目」package registry 的
#   write_package_registry 权限，发布到本项目自己的 registry 无须额外 token。
#   若你的 GitLab 版本较旧、CI_JOB_TOKEN 无包写权限，改在
#   Settings → CI/CD → Variables 加 NPM_TOKEN=个人 token（保护变量），
#   并把下面第二行 _authToken=${CI_JOB_TOKEN} 换成 _authToken=${NPM_TOKEN}。

stages:
  - publish

publish-npm:
  stage: publish
  image: node:22
  rules:
    # 仅语义化版本 tag 触发，避免每次 push 都发版导致 409
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - echo "@huangshichuang:registry=https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" > .npmrc
    - echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
  script:
    - npm ci
    - npm run build:lib
    - npm run build:types
    - npm publish
  artifacts:
    when: on_failure
    paths:
      - dist/
