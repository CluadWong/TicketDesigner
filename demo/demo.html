<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>表单打印尺寸校准版｜单DOM媒体查询重排</title>
<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* 公共组件样式（屏幕与打印共享） */
.paper__header{
  width: 100%;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  height: 14mm;
  line-height: 14mm;
}
.subform{
  position: relative;
  background: transparent;
}

/* ========== 屏幕预览：虚拟A4纸张，单张子表单对应一张纸，垂直堆叠 ========== */
@media screen {
  body{
    background: #eeeeee;
    padding: 20px;
  }
  .wrapper{
    display: block;
  }
  /* 虚拟A4纸张：红示意边框 + 12mm内边距 */
  .paper{
    width: 210mm;
    height: 297mm;
    border: 1mm solid #eee;
    padding: 12mm;
    background: #fff;
    margin-bottom: 24px;
  }
  /* 子表单：蓝示意边框，内容区尺寸 182mm × 255mm（已扣除自身蓝边框） */
  .subform{
    width: 184mm;  /* border-box：182mm内容区 + 2mm蓝边框 */
    height: 257mm; /* border-box：255mm内容区 + 2mm蓝边框 */
    border: 1mm solid blue;
  }
}

/* ========== 打印输出：A3横向双栏，display:contents穿透重排，DOM不复制 ========== */
@media print {
  @page {
    size: A3 landscape;
    margin: 12mm; /* 打印物理页边距；可打印高度 =297‑12‑12 =273mm */
  }
  html, body {
    height: auto !important;
    background: #fff;
  }

  /* wrapper 成为 flex 容器：子表单两栏并排 */
  .wrapper{
    display: flex !important;
    flex-wrap: wrap !important;
    flex-direction: row !important;
    row-gap: 1mm !important;     /* 标题行与子表单行之间的安全间隙 */
    column-gap: 12mm !important; /* 两子表单水平间隔 */
    width: 100% !important;
  }

  /* paper 外壳穿透：红框移除、不占空间，子元素直接参与 wrapper 的 flex 布局 */
  .paper{
    display: contents !important;
  }

  /* 偶数位 paper（第2、4、6…个）的标题隐藏，奇数位（第1、3、5…个）显示并独占一行 */
  .paper:nth-child(even) .paper__header{
    display: none !important;
  }
  /* 显示的标题占满一行，强制后续子表单换到下一行 */
  .paper__header{
    flex: 0 0 100% !important;
  }

  /*
    子表单：蓝示意边框
    border‑box：外部元素尺寸192mm × 257mm
    业务内容区：190mm × 255mm（扣除左右/上下各1mm蓝色边框）
    总占用高度：14(标题)+1(间隙)+257(子表单)=272mm < 273mm，预留1mm安全余量
  */
  .subform{
    flex: 0 0 192mm !important;
    height: 257mm !important;
    border: 1mm solid blue !important;
    break-inside: avoid !important;
    page-break-inside: avoid !important;
  }

  /* 强制打印边框颜色 */
  *{
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
}
</style>
</head>
<body>

<!-- 单一 DOM：多个 .paper，屏幕与打印复用同一套节点，不复制、不新增视图容器 -->
<div class="wrapper">
  <div class="paper">
    <div class="paper__header">云南铝业股份有限公司电气工作票汇总</div>
    <div class="subform">
      <div style="position:absolute;top:5mm;left:5mm;font-size:16px;">子表单组件1</div>
      <div style="position:absolute;top:20mm;left:5mm;border:1px solid #333;padding:2px;">表单字段示例1</div>
    </div>
  </div>

  <div class="paper">
    <div class="paper__header">云南铝业股份有限公司电气工作票汇总</div>
    <div class="subform">
      <div style="position:absolute;top:5mm;left:5mm;font-size:16px;">子表单组件2</div>
      <div style="position:absolute;top:20mm;left:5mm;border:1px solid #333;padding:2px;">表单字段示例2</div>
    </div>
  </div>
</div>

</body>
</html>
