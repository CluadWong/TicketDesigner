<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Word式离散分页验证｜design-v2 模型</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#e8e8e8; font-family:"Microsoft YaHei",sans-serif; padding:20px; font-size:14px; }

/* 工具栏 */
.toolbar {
  position:sticky; top:0; background:#fff; padding:10px 16px; margin:-20px -20px 16px;
  border-bottom:1px solid #ddd; z-index:10;
  display:flex; gap:12px; align-items:center; flex-wrap:wrap;
}
.toolbar select, .toolbar button { padding:4px 10px; }
.toolbar .hint { color:#888; font-size:12px; }
.toolbar .info { color:#2257a5; font-weight:bold; }

/* 屏幕离散纸张堆叠 */
.page-stack { display:flex; flex-direction:column; align-items:center; gap:20px; }
.paper {
  background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
  position:relative;
  overflow:hidden;
}
.content { position:relative; }
.header-slot { border-bottom:1px solid #999; text-align:center; font-weight:bold; }
.footer-slot { border-top:1px solid #999; text-align:center; position:absolute; bottom:0; left:0; right:0; }
.body-slot { overflow:hidden; }

/* 组件样式 */
.comp-p { margin:0 0 4px; font-size:14px; line-height:1.6; }
.comp-grid {
  display:grid; grid-template-columns:1fr 1fr; gap:4mm;
  border:1px solid #5b8def; padding:3mm; background:#f0f5ff; margin-bottom:4px;
}
.comp-grid > div { border:1px dashed #5b8def; padding:2mm; font-size:12px; background:#fff; }
.comp-grid .grid-label { grid-column:1/-1; font-weight:bold; color:#2257a5; }

.data-table { width:100%; border-collapse:collapse; margin-bottom:4px; }
.data-table th, .data-table td { border:1px solid #333; padding:3px 5px; font-size:12px; }
.data-table th { background:#e8e8e8; text-align:center; }

/* off-screen 测量容器：宽度由 JS 设为内容区宽，保证测高准确 */
.measurer { position:absolute; left:-99999px; top:0; visibility:hidden; }

/* 打印：去掉 .paper 自身尺寸/padding，由 @page margin 接管；复用屏幕 DOM 结构 */
@media print {
  body { background:#fff; padding:0; }
  .toolbar { display:none !important; }
  .measurer { display:none !important; }
  .page-stack { gap:0; }
  .paper {
    width:auto !important;
    height:auto !important;
    padding:0 !important;
    box-shadow:none !important;
    page-break-after:always;
    break-after:page;
  }
  .paper:last-child { page-break-after:auto; break-after:auto; }
  .content { width:auto !important; height:auto !important; }
  .body-slot { height:auto !important; overflow:visible !important; }
  .footer-slot { position:static !important; }
  * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
</style>
</head>
<body>

<div class="toolbar">
  <strong>纸张：</strong>
  <select id="paper-size">
    <option value="A4">A4</option>
    <option value="A3">A3</option>
  </select>
  <select id="paper-orient">
    <option value="portrait">纵向</option>
    <option value="landscape">横向</option>
  </select>
  <button id="repaginate">重新分页</button>
  <button id="print" style="background:#2257a5;color:#fff;border:none;">打印预览</button>
  <span class="info" id="info"></span>
  <span class="hint">验证点：①内容超纸高自动开新页 ②表格按行切分跨页 ③grid容器不跨页 ④每页页眉/页脚/页码</span>
</div>

<div id="pages" class="page-stack"></div>
<div class="measurer" id="measurer"></div>

<script>
/**
 * 纸张短长边（mm）
 * A4 = 210 × 297；A3 = 297 × 420
 */
const PAPER_GEOM = {
  A4: { short:210, long:297 },
  A3: { short:297, long:420 }
};
const MARGIN = 12;        // mm，左右边距（上下边距=0，由页眉/页脚占位）
const HEADER_H = 12;     // mm，页眉高（=原上边距，贴纸张顶部）
const FOOTER_H = 12;     // mm，页脚高（=原下边距，贴纸张底部）
const PX_PER_MM = 96 / 25.4;  // 浏览器 CSS mm → px 换算

let state = { size:'A4', orient:'portrait' };

/**
 * 计算当前选中纸张的宽高（mm）
 * landscape: 长边作宽；portrait: 短边作宽
 */
function geom(){
  const p = PAPER_GEOM[state.size];
  return state.orient==='landscape'
    ? { w:p.long, h:p.short }
    : { w:p.short, h:p.long };
}

/**
 * 内容流：模拟设计器里拖出的组件序列（按顺序流入正文）
 */
const stream = [
  { type:'p', text:'云南铝业股份有限公司电气工作票。本工作票适用于电气设备的检修、试验、清扫等工作，工作人员必须严格遵守安全规程。' },
  { type:'p', text:'工作负责人应在工作前向全体工作人员交代工作内容、安全措施、带电部位及注意事项。工作期间不得擅自离开工作现场。' },
  { type:'grid', label:'工作基本信息（grid 容器，不跨页）', cells:[
    '工作票编号：GD-2026-08-001','工作负责人：张三',
    '工作地点：10kV 配电室','工作班组：电气一班',
    '计划开工：2026-08-20 08:00','计划完工：2026-08-20 17:00'
  ]},
  { type:'table',
    thead:'<tr><th style="width:14mm">序号</th><th>工作内容</th><th style="width:24mm">负责人</th><th style="width:24mm">工时</th><th style="width:20mm">完成</th></tr>',
    rows:[] },
  { type:'grid', label:'安全措施（第二个 grid，验证容器不跨页）', cells:[
    '断开主进线断路器','验电并挂接地线',
    '悬挂"禁止合闸"标示牌','装设临时遮栏'
  ]},
  { type:'p', text:'以上为工作内容明细，所有工作项均已完成验收。本工作票一式两份，工作负责人与运行值班人员各执一份。' }
];
// 生成 60 行表格数据（用于验证跨页切分）
const tbl = stream.find(s=>s.type==='table');
for(let i=1;i<=60;i++){
  tbl.rows.push(
    `<tr><td>${i}</td><td>设备检修项 ${i}：检查并测试相关参数</td><td>张三</td><td>${(i*0.5).toFixed(1)}h</td><td>${i%2?'是':'否'}</td></tr>`
  );
}

/**
 * 渲染非表格组件为 HTML 字符串
 */
function renderItem(item){
  if(item.type==='p') return `<p class="comp-p">${item.text}</p>`;
  if(item.type==='grid'){
    const cells = item.cells.map(c=>`<div>${c}</div>`).join('');
    return `<div class="comp-grid"><div class="grid-label">${item.label}</div>${cells}</div>`;
  }
  return '';
}

const measurer = document.getElementById('measurer');

/**
 * 测量任意 HTML 片段高度（px）
 */
function measure(html){
  measurer.innerHTML = html;
  return measurer.offsetHeight;
}

/**
 * 测量表格表头高度（px）
 */
function measureTableHeader(thead){
  measurer.innerHTML = `<table class="data-table"><thead>${thead}</thead><tbody></tbody></table>`;
  return measurer.offsetHeight;
}

/**
 * 测量单行高度：含该行的 table 高度 - 不含该行的 table 高度
 */
function measureTableRow(thead, row){
  measurer.innerHTML = `<table class="data-table"><thead>${thead}</thead><tbody></tbody></table>`;
  const base = measurer.offsetHeight;
  measurer.innerHTML = `<table class="data-table"><thead>${thead}</thead><tbody>${row}</tbody></table>`;
  return measurer.offsetHeight - base;
}

/**
 * 分页引擎：内容流 → Page[]
 *
 * Page = { blocks: Block[] }
 * Block = { type:'item', html } | { type:'table', thead, rows:[] }
 *
 * 规则：
 *  - 普通组件 / grid 容器：整体测高，超高则整体推到下一页（不跨页）
 *  - 表格：按行测高，按页可用高度切分；每个表格切片都重新带 thead（表头每页重复）
 *  - 每页正文可用高 = 纸高 − 页眉高 − 页脚高（上下边距=0，由页眉/页脚占位）
 */
function paginate(stream, g){
  const contentWmm = g.w - 2*MARGIN;
  const bodyHmm = g.h - HEADER_H - FOOTER_H;   // 上下边距=0，只扣页眉页脚
  const bodyPx = bodyHmm * PX_PER_MM;
  const contentPx = contentWmm * PX_PER_MM;
  measurer.style.width = contentPx + 'px';

  const pages = [];
  let cur = { blocks:[], used:0 };
  const flush = ()=>{ if(cur.blocks.length) pages.push(cur); cur = { blocks:[], used:0 }; };

  for(const item of stream){
    if(item.type==='table'){
      // 预测每行高度
      const theadPx = measureTableHeader(item.thead);
      const rowPxArr = item.rows.map(r=>measureTableRow(item.thead, r));

      let i = 0;
      while(i < item.rows.length){
        // 当前页剩余可用高度
        let avail = bodyPx - cur.used;
        // 至少要放表头+1行；放不下则开新页
        if(avail < theadPx + rowPxArr[i] + 1){
          flush();
          avail = bodyPx;
        }
        // 收集本页可容纳的行
        const segRows = [];
        let segPx = theadPx;  // 每个表格切片都含表头
        while(i < item.rows.length && segPx + rowPxArr[i] <= avail){
          segRows.push(item.rows[i]);
          segPx += rowPxArr[i];
          i++;
        }
        if(segRows.length){
          cur.blocks.push({ type:'table', thead:item.thead, rows:segRows });
          cur.used += segPx;
        }
        if(i < item.rows.length){
          // 当前页已满，仍有剩余行 → 开新页继续
          flush();
        }
      }
    }else{
      // 普通组件 / grid 容器：不跨页，整体测高
      const html = renderItem(item);
      const px = measure(html);
      if(cur.used + px > bodyPx && cur.blocks.length){
        flush();
      }
      cur.blocks.push({ type:'item', html });
      cur.used += px;
    }
  }
  flush();
  return pages;
}

/**
 * 渲染单个 Block 为 HTML
 */
function renderBlock(b){
  if(b.type==='item') return b.html;
  if(b.type==='table') return `<table class="data-table"><thead>${b.thead}</thead><tbody>${b.rows.join('')}</tbody></table>`;
  return '';
}

/**
 * 渲染分页结果到 DOM
 */
function renderPages(pages){
  const g = geom();
  const contentWmm = g.w - 2*MARGIN;
  const contentHmm = g.h;                      // 上下边距=0，内容区高=纸张高
  const bodyHmm = contentHmm - HEADER_H - FOOTER_H;

  const html = pages.map((p, i)=>`
    <div class="paper" style="width:${g.w}mm; height:${g.h}mm; padding:0 ${MARGIN}mm;">
      <div class="content" style="width:${contentWmm}mm; height:${contentHmm}mm; position:relative;">
        <div class="header-slot" style="height:${HEADER_H}mm; line-height:${HEADER_H}mm;">云南铝业股份有限公司电气工作票汇总</div>
        <div class="body-slot" style="height:${bodyHmm}mm;">
          ${p.blocks.map(renderBlock).join('')}
        </div>
        <div class="footer-slot" style="height:${FOOTER_H}mm; line-height:${FOOTER_H}mm;">第 ${i+1} 页 / 共 ${pages.length} 页</div>
      </div>
    </div>
  `).join('');
  document.getElementById('pages').innerHTML = html;
}

/**
 * 动态注入打印 @page 规则（按当前纸张尺寸与方向）
 */
function injectPrintStyle(){
  const sizeStr = state.orient==='landscape' ? `${state.size} landscape` : state.size;
  const css = `@media print { @page { size: ${sizeStr}; margin: 0 ${MARGIN}mm; } }`;  // 上下0(页眉页脚占位)，左右边距
  let st = document.getElementById('print-style');
  if(!st){
    st = document.createElement('style');
    st.id = 'print-style';
    document.head.appendChild(st);
  }
  st.textContent = css;
}

/**
 * 主流程：分页 → 渲染 → 注入打印样式
 */
function run(){
  const g = geom();
  const pages = paginate(stream, g);
  renderPages(pages);
  injectPrintStyle();
  document.getElementById('info').textContent = `共 ${pages.length} 页`;
}

document.getElementById('paper-size').addEventListener('change', e=>{ state.size = e.target.value; run(); });
document.getElementById('paper-orient').addEventListener('change', e=>{ state.orient = e.target.value; run(); });
document.getElementById('repaginate').addEventListener('click', run);
document.getElementById('print').addEventListener('click', ()=>window.print());

run();
</script>

</body>
</html>
