<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>混合模型｜固定字段区 + 表格流式区分离</title>
<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ========== 公共组件样式（屏幕与打印共享） ========== */
.paper__header{
  width: 100%;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  height: 14mm;
  line-height: 14mm;
}

/* 固定字段区：relative 容器，内部 absolute 定位字段 */
.fixed-fields{
  position: relative;
  height: 30mm;
  border: 1mm solid blue;
  break-inside: avoid;            /* 固定字段区不可分页 */
  page-break-inside: avoid;
}
.fixed-fields .field{
  position: absolute;
  font-size: 14px;
}

/* 表格流式区：正常文档流 + CSS 多栏 + 碎片化（核心） */
.table-flow{
  column-count: 2;                /* 两栏流动 */
  column-gap: 12mm;               /* 与现有两栏 gap 对齐 */
  column-rule: 1px solid #ccc;    /* 栏间细线（屏幕可见） */
  break-inside: auto;             /* 允许跨页/跨栏分割 */
}
.table-flow table{
  width: 100%;
  border-collapse: collapse;
  break-inside: auto;             /* 表格本身允许碎片化 */
}
.table-flow thead{
  display: table-header-group;   /* 每栏/每页自动重复表头 */
}
.table-flow tr{
  break-inside: avoid;           /* 单行不被切断 */
  page-break-inside: avoid;
}
.table-flow th,
.table-flow td{
  border: 1px solid #333;
  padding: 3px;
  font-size: 12px;
  text-align: center;
}
.table-flow th{
  background: #e8e8e8;
}

/* ========== 屏幕预览：虚拟 A3 横向纸张，纸张随内容增高 ========== */
@media screen {
  body{
    background: #eeeeee;
    padding: 20px;
  }
  .wrapper{
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* 虚拟 A3 横向纸张：灰示意边框 + 12mm 内边距 */
  .paper{
    width: 420mm;
    min-height: 297mm;            /* 最小一页高；表格长则自动撑高 */
    border: 1mm solid #eee;
    padding: 12mm;
    background: #fff;
    margin-bottom: 24px;
  }
  .paper__header{
    margin-bottom: 1mm;
  }
  .fixed-fields{
    margin-bottom: 2mm;
  }
}

/* ========== 打印输出：A3 横向，表格跨栏跨页自动分页 ========== */
@media print {
  @page {
    size: A3 landscape;
    margin: 12mm;                 /* 可打印高度 273mm，宽度 396mm */
  }
  html, body{
    height: auto !important;
    background: #fff;
  }

  .wrapper{
    display: block !important;
  }
  /* paper 外壳在打印中只作普通容器：去边框、去 padding（由 @page margin 接管） */
  .paper{
    border: none !important;
    padding: 0 !important;
    width: auto !important;
    min-height: 0 !important;
  }

  .paper__header{
    margin-bottom: 1mm !important;  /* 标题底部安全间隙 */
  }
  .fixed-fields{
    margin-bottom: 2mm !important;
    border: 1mm solid blue !important;
  }

  /* 强制打印颜色保留（表头背景） */
  *{
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
}
</style>
</head>
<body>

<!--
  混合模型：一张"票据"内含两个布局语义不同的区域
  1) .fixed-fields 固定字段区：absolute 定位，定高 30mm，不分页
  2) .table-flow  表格流式区：正常流 + 多栏 + 碎片化，跨栏跨页自动分页
  标题/固定字段仅在首页渲染；续页只有表格（thead 自动重复表头）
-->
<div class="wrapper">
  <div class="paper">
    <div class="paper__header">云南铝业股份有限公司电气工作票汇总</div>

    <!-- 固定字段区 -->
    <div class="fixed-fields">
      <div class="field" style="top:4mm;left:4mm;">工作票编号：GD-2026-08-001</div>
      <div class="field" style="top:4mm;left:140mm;">工作负责人：张三</div>
      <div class="field" style="top:4mm;right:4mm;">日期：2026-08-20</div>
      <div class="field" style="top:16mm;left:4mm;">工作地点：10kV 配电室</div>
      <div class="field" style="top:16mm;left:140mm;">工作班组：电气一班</div>
    </div>

    <!-- 表格流式区 -->
    <div class="table-flow">
      <table>
        <thead>
          <tr>
            <th style="width:14mm;">序号</th>
            <th>工作内容</th>
            <th style="width:24mm;">负责人</th>
            <th style="width:24mm;">预计工时</th>
            <th style="width:24mm;">是否完成</th>
          </tr>
        </thead>
        <tbody id="demo-tbody">
          <!-- 演示数据由脚本生成（仅演示数据，非布局逻辑） -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  /**
   * 生成演示用超多行表格数据
   * 仅用于演示数据填充，不参与打印布局决策
   */
  (function () {
    var tbody = document.getElementById('demo-tbody');
    if (!tbody) return;
    var contents = [
      '10kV配电室设备检修', '电缆绝缘测试', '开关柜清扫维护',
      '继电保护校验', '接地装置检查', '变压器油样取样',
      '母线连接紧固', '避雷器测试更换', '直流屏蓄电池巡检',
      'SF6气体微水检测'
    ];
    var persons = ['张三', '李四', '王五', '赵六', '钱七'];
    var html = '';
    for (var i = 1; i <= 80; i++) {
      var c = contents[i % contents.length];
      var p = persons[i % persons.length];
      var done = (i % 2) ? '是' : '否';
      html += '<tr><td>' + i + '</td><td>' + c + '</td><td>' + p
        + '</td><td>' + (i * 0.5).toFixed(1) + 'h</td><td>' + done + '</td></tr>';
    }
    tbody.innerHTML = html;
  })();
</script>

</body>
</html>
